<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Connexion API CVVEN</title>
</head>
<body>
    <h1>Test de communication Frontend (5500) → API Flask (5000)</h1>
    <p id="resultat">Chargement...</p>

    <script>
        fetch('http://127.0.0.1:5000/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('resultat').innerText =
                    `Statut : ${data.status} | Message : ${data.message} (${data.centres_en_base} centres trouvés)`;
            })
            .catch(err => {
                document.getElementById('resultat').innerText =
                    "Erreur : L'API Flask ne répond pas. Vérifie que 'python run.py' tourne bien.";
            });
    </script>
</body>
</html>
